[platformio]
default_envs = proton

[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags = -O0
build_src_filter = +<main.c> +<lcd.c> +<display.c>
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200

[env:proton-ramp]
extends = env:proton
build_flags = -DTFT_RAMP_TEST
